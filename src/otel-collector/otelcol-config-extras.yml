exporters:
  otlp_grpc/sre_backend:
    endpoint: "${env:SRE_SERVER_IP}:4317"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      exporters: [otlp_grpc/jaeger, debug, span_metrics, otlp_grpc/sre_backend]
    metrics:
      exporters: [otlp_http/prometheus, debug, otlp_grpc/sre_backend]
    logs:
      exporters: [opensearch, debug, otlp_grpc/sre_backend]