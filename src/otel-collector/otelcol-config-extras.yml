exporters:
  otlp_grpc/sre_backend:
    endpoint: "${env:SRE_SERVER_IP}:4317"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      exporters: [debug, span_metrics, otlp_grpc/sre_backend]
    metrics:
      exporters: [debug, otlp_grpc/sre_backend]
    logs:
      exporters: [debug, otlp_grpc/sre_backend]